[project]
name = "awq-from-scratch"
version = "1.0.0"
description = "Universal, block-streaming AWQ (Activation-aware Weight Quantization) for any causal LM — from scratch in pure PyTorch."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "accelerate>=0.30",
    "datasets>=2.18",
    "safetensors>=0.4.2",
    "huggingface_hub>=0.34",
    "zstandard>=0.22",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[project.optional-dependencies]
eval = ["lm-eval>=0.4.4"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["awq*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
